<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Pierre MAGIEU">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outdoor Explorer</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script type="text/javascript" src="data/sports.js"></script>
    <script src="./js/main.js" defer></script>

</head>
<body>

    <div class="scene">
        <div class="book">
            <div class="rings" id="rings"></div>

            <!-- Couverture -->
            <div class="front-page">
                <div class="cover-title" id="cover-title">Outdoor<br>Explorer</div>
                <img class="img-front-page" id="img-front-page" src="assets/illustrations/montagnes_front_page.svg" alt="Mountains icons">
            </div>

            <!-- Derrière de couverture & première page -->
            <div class="back-front-page hidden" id="backPage"></div>

            <div class="page-wrapper right hidden" id="connexionPage">
                <div class="page-face front right-page" >
                    <div class="connexion-title" id="cover-connexion-title">Outdoor<br>Explorer</div>
                    <div class="connexion-subtitle" id="connexion-subtitle">LES SPORTS PLEIN AIR</div>

                    <div class="connexion-part">
                        <div>Connectez-vous pour vous continuer !</div>
                        <form class="connexion-form" id="connexionForm">
                            <p>
                                <img src="assets/icons/user.svg">
                                <input class="connexion-input" id="connexion-input" type="text" placeholder="Nom d'utilisateur" required>
                            </p>
                            <button class="connexion-submit" id="connexionSubmit">Connexion</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- structure de l'affichage des sports -->
            <div class="page-wrapper left hidden" id="leftPage">
                <div class="page-face front left-page">
                    <div class="sport-name-container" id="container">
                        <div class="sport-name" id="sport"></div>
                    </div>

                    <!--                <img class="illustration" id="illustration" src="" alt="">-->
                    <div class="description " id="description"></div>

                    <!--                A changer en fonction de la réussite du mini jeu-->
                    <img class="badge" id="badge" src="" alt="Reward of the sport">

                    <button class="game-btn" id="game">Lancer le mini jeu</button>
                </div>
            </div>



            <div class="page-wrapper right hidden" id="rightPage">
                <div class="page-face front right-page sport-page ">
                    <div class="game-not-done" id="game-not-done">Déverrouillez les informations en jouant au mini-jeu !</div>

                    <div class="informations-container">
                        <div class="confidential hidden" id="confidential"></div>
                        <div class="informations">
                            <div class="resume" id = "resume"></div>

                            <div class="season" id="season"></div>

                            <h4>Coût de la pratique</h4>
                            <div class="cost" id="cost"></div>

                            <div class="material-benefits">
                                <div class="material-container">
                                    <h4>Matériel nécessaire</h4>
                                    <div class="material" id="material"></div>
                                </div>

                                <div class="benefits-container">
                                    <h4>Bienfaits</h4>
                                    <div class="benefits" id="benefits"></div>
                                </div>
                            </div>


                            <h4>Conseils</h4>
                            <div class="tips" id = "tips"></div>

                            <div class="club-link" id="club">Si tu veux plus <b>d'informations</b> pour pratiquer rends-toi sur ce(s) lien(s) : </div>

                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <button class="btn-open hidden" id="btnOpen" onclick="openBook()">
        Ouvrir le livre
    </button>

</body>
</html>
