<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Pierre MAGIEU">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outdoor Explorer</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <script src="./js/main.js"></script>
</head>
<body>

    <div class="scene">
        <div class="book">
            <div class="rings" id="rings"></div>

            <!-- Couverture -->
            <div class="front-page">
                <div class="cover-title" id="cover-title">Outdoor<br>Explorer</div>
                <img class="img-front-page" id="img-front-page" src="assets/illustrations/montagnes_front_page.svg" alt="Mountains icons">
            </div>

            <!-- Derrière de couverture & première page -->
            <div class="back-front-page"></div>
            <div class="connexion-page">
                <div class="connexion-title" id="cover-connexion-title">Outdoor<br>Explorer</div>
                <div class="connexion-subtitle" id="connexion-subtitle">LES SPORTS PLEIN AIR</div>

                <div class="connexion-part">
                    <div>Connectez-vous pour vous continuer !</div>
                    <form class="connexion-form" id="connexion-form">
                        <input class="connexion-input" id="connexion-input" type="text" placeholder="Nom d'utilisateur" required>

                    </form>
                </div>

            </div>

        </div>
    </div>

    <button class="btn-open" id="btnOpen" onclick="openBook()">
        Ouvrir le livre
    </button>

</body>
</html>
