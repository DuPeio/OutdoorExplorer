<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Pierre MAGIEU">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outdoor Explorer</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script type="text/javascript" src="data/sports.js"></script>
    <script src="./js/main.js" defer></script>

</head>
<body>

    <div class="scene">
        <div class="book" id="book">
            <div class="rings" id="rings"></div>

            <!-- Couverture -->
            <div class="cover" id = "cover">
                <div class="front face">
                    <div class="cover-title" id="cover-title">Outdoor<br>Explorer</div>
                    <img class="img-cover" id="imgCover" src="assets/illustrations/montagnes_front_page.svg" alt="Mountains icons">
                </div>
                <div class="back face"></div>
            </div>

            <!--Quatrieme de couverture-->
            <div class="cover last-cover" id="lastCover">
            </div>

            <!--Page-->
            <div class="page hidden" id="page0">
                <div class="front face">
                    <div class="connexion-container" id="connexion-container">
                        <div class="connexion-title" id="cover-connexion-title">Outdoor<br>Explorer</div>
                        <div class="connexion-subtitle" id="connexion-subtitle">LES SPORTS PLEIN AIR</div>

                        <div class="connexion-part">
                            <div>Connectez-vous pour vous continuer !</div>
                            <form class="connexion-form" id="connexionForm">
                                <p>
                                    <img src="assets/icons/user.svg">
                                    <input class="connexion-input" id="connexion-input" type="text" placeholder="Nom d'utilisateur" required>
                                </p>
                                <button class="connexion-submit" id="connexionSubmit">Connexion</button>
                            </form>
                        </div>
                    </div>
                </div>


                <div class="back face">
                    <div class="sport-container">
                        <div class="sport-name-container" id="container0">
                            <div class="sport-name" id="sport0"></div>
                        </div>

                        <div class="description " id="description0"></div>

                        <!--A changer en fonction de la réussite du mini jeu-->
                        <img class="badge" id="badge0" src="" alt="Reward of the sport">

                        <button class="game-btn" id="game0">Lancer le mini jeu</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <button class="btn-open hidden" id="btnOpen" onclick="openBook()">
        Ouvrir le livre
    </button>

</body>
</html>
