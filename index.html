<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Pierre MAGIEU">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outdoor Explorer</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <script type="text/javascript" src="data/sports.js"></script>
    <script src="./js/main.js"></script>

</head>
<body>

    <div class="scene">
        <div class="book">
            <div class="rings" id="rings"></div>

            <!-- Couverture -->
            <div class="front-page">
                <div class="cover-title hidden" id="cover-title">Outdoor<br>Explorer</div>
                <img class="img-front-page hidden" id="img-front-page" src="assets/illustrations/montagnes_front_page.svg" alt="Mountains icons">
            </div>

            <!-- Derrière de couverture & première page -->
            <div class="back-front-page"></div>

            <div class="right-page hidden">
                <div class="connexion-title" id="cover-connexion-title">Outdoor<br>Explorer</div>
                <div class="connexion-subtitle" id="connexion-subtitle">LES SPORTS PLEIN AIR</div>

                <div class="connexion-part">
                    <div>Connectez-vous pour vous continuer !</div>
                    <form class="connexion-form" id="connexion-form">
                        <p>
                            <img src="assets/icons/user.svg">
                            <input class="connexion-input" id="connexion-input" type="text" placeholder="Nom d'utilisateur" required>
                        </p>
                        <button class="connexion-submit" id="connexion-submit">Connexion</button>
                    </form>
                </div>

            </div>

            <!-- structure de l'affichage des sports -->
            <div class="left-page">
                <div class="sport-name" id="sport"></div>
                <img class="illustration" id="illustration" src="" alt="">
                <div class="description " id="description"></div>

                <img class="badge" id="badge" src="" alt="Reward of the sport">

                <button class="game" id="game" ></button>
            </div>

            <div class="right-page sport-page">
                <div class="game-not-done" id="game-not-done">Déverrouillez les informations en jouant au mini-jeu !</div>

                <div class="confidential">
                    <div class="resume" id = "resume"></div>

                    <div class="tips" id = "tips"></div>

                    <div class="club-link" id="club"></div>

                    <div class="material" id="material"></div>

                    <div class="cost" id="cost"></div>

                    <div class="benefits" id="benefits"></div>

                    <div class="season" id="season"></div>
                </div>

            </div>


        </div>
    </div>

    <button class="btn-open hidden" id="btnOpen" onclick="openBook()">
        Ouvrir le livre
    </button>

</body>
</html>
